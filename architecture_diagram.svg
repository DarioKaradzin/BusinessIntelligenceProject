<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="590" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a2e">AI Agent Architecture — Superstore BI Solution</text>

  <!-- defs: arrowhead -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#5b6472"/>
    </marker>
  </defs>

  <!-- Row 1: User -> agy -> MCP -> Supabase -->
  <!-- User -->
  <rect x="40" y="120" width="180" height="90" rx="10" fill="#e8f1fb" stroke="#2f6db0" stroke-width="2"/>
  <text x="130" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">User</text>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#4a4a4a">Asks questions in</text>
  <text x="130" y="198" text-anchor="middle" font-size="12" fill="#4a4a4a">plain English</text>

  <!-- Antigravity CLI -->
  <rect x="300" y="110" width="200" height="110" rx="10" fill="#e6f7ee" stroke="#2e9e63" stroke-width="2"/>
  <text x="400" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Antigravity CLI (agy)</text>
  <text x="400" y="170" text-anchor="middle" font-size="12" fill="#4a4a4a">Gemini agent</text>
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#4a4a4a">Reads AGENTS.md,</text>
  <text x="400" y="204" text-anchor="middle" font-size="12" fill="#4a4a4a">generates SQL</text>

  <!-- MCP Servers -->
  <rect x="580" y="110" width="200" height="110" rx="10" fill="#e6f7ee" stroke="#2e9e63" stroke-width="2"/>
  <text x="680" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">MCP Servers</text>
  <text x="680" y="170" text-anchor="middle" font-size="12" fill="#4a4a4a">supabase (schema + SQL)</text>
  <text x="680" y="188" text-anchor="middle" font-size="12" fill="#4a4a4a">superset-mcp</text>
  <text x="680" y="204" text-anchor="middle" font-size="12" fill="#4a4a4a">(charts + dashboards)</text>

  <!-- Supabase -->
  <rect x="860" y="110" width="200" height="110" rx="10" fill="#fdf3d7" stroke="#c9a227" stroke-width="2"/>
  <text x="960" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Supabase</text>
  <text x="960" y="168" text-anchor="middle" font-size="13" fill="#4a4a4a">PostgreSQL warehouse</text>
  <text x="960" y="188" text-anchor="middle" font-size="12" fill="#4a4a4a">Star schema:</text>
  <text x="960" y="204" text-anchor="middle" font-size="12" fill="#4a4a4a">fact_sales + 5 dims</text>

  <!-- arrows row 1 -->
  <line x1="220" y1="165" x2="298" y2="165" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="165" x2="578" y2="165" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="165" x2="858" y2="165" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- return arrow agy <- mcp (results) -->
  <text x="540" y="150" text-anchor="middle" font-size="10" fill="#8a8a8a">MCP</text>

  <!-- Row 2: Supabase -> Superset -> Dashboards -->
  <!-- Superset -->
  <rect x="860" y="330" width="200" height="100" rx="10" fill="#efe6fa" stroke="#7a4fbf" stroke-width="2"/>
  <text x="960" y="366" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Apache Superset</text>
  <text x="960" y="390" text-anchor="middle" font-size="12" fill="#4a4a4a">Docker, port 8088</text>
  <text x="960" y="408" text-anchor="middle" font-size="12" fill="#4a4a4a">SQLAlchemy connection</text>

  <!-- Dashboards -->
  <rect x="500" y="330" width="260" height="100" rx="10" fill="#e3f6f5" stroke="#2b9d92" stroke-width="2"/>
  <text x="630" y="362" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">Dashboards</text>
  <text x="630" y="384" text-anchor="middle" font-size="12" fill="#4a4a4a">Executive Overview · Product</text>
  <text x="630" y="401" text-anchor="middle" font-size="12" fill="#4a4a4a">Performance · Geography &amp; Customers</text>

  <!-- arrows row 2 -->
  <line x1="960" y1="220" x2="960" y2="328" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1000" y="278" text-anchor="middle" font-size="11" fill="#8a8a8a">reads data</text>
  <line x1="858" y1="380" x2="762" y2="380" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- User views dashboards (long return) -->
  <line x1="500" y1="380" x2="130" y2="380" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="380" x2="130" y2="212" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="315" y="370" text-anchor="middle" font-size="11" fill="#8a8a8a">user explores visuals</text>

  <!-- Legend -->
  <text x="60" y="470" font-size="14" font-weight="bold" fill="#1a1a2e">Legend</text>
  <rect x="60" y="482" width="18" height="18" fill="#e8f1fb" stroke="#2f6db0"/>
  <text x="86" y="496" font-size="13" fill="#4a4a4a">User interface</text>
  <rect x="220" y="482" width="18" height="18" fill="#e6f7ee" stroke="#2e9e63"/>
  <text x="246" y="496" font-size="13" fill="#4a4a4a">Agent / connection layer</text>
  <rect x="440" y="482" width="18" height="18" fill="#fdf3d7" stroke="#c9a227"/>
  <text x="466" y="496" font-size="13" fill="#4a4a4a">Data source</text>
  <rect x="590" y="482" width="18" height="18" fill="#efe6fa" stroke="#7a4fbf"/>
  <text x="616" y="496" font-size="13" fill="#4a4a4a">Visualization layer</text>
  <rect x="770" y="482" width="18" height="18" fill="#e3f6f5" stroke="#2b9d92"/>
  <text x="796" y="496" font-size="13" fill="#4a4a4a">Output</text>

  <text x="60" y="560" font-size="12" fill="#8a8a8a">Flow: the user asks a question → agy generates SQL following AGENTS.md → the supabase MCP runs it against the star schema →</text>
  <text x="60" y="578" font-size="12" fill="#8a8a8a">results return to the agent; Superset reads the same warehouse to render the three dashboards the user explores.</text>
</svg>
